id = "cheats"
name = "Cheats"
version = "0.3.0"
library = "libcheats.so"
api = 3
enabled = false

[settings]
# Initial state of the cheats (they are opt-in: both start off; the F9 menu rows change them live).
# slow_motion: off | 0.5 | 0.25 - time scale of every car (the player's and the AI's)
slow_motion = "off"
# freeze_ai: true = AI cars skip their physics step (they stand still, keeping their speed for when you turn it off)
freeze_ai = false
