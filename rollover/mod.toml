id = "rollover"
name = "Rollovers"
version = "0.5.0"
library = "librollover.so"
api = 7
enabled = false

[settings]
# realistic: a rigid-body simulation takes the car when it is hit hard, flipped or airborne and spinning (gravity, bounces, friction), and hands it back on its wheels.
# arcade: the 0.4.0 scripted roll (a held roll rate after a hard side impact; threshold halved, gain x1.5), no simulation
style = "realistic"
# realistic: mass of the simulated car (kg)
mass = 1300.0
# realistic: bounce of the car's hull on the ground (0 = none; below 1 m/s of approach there is never a bounce)
restitution = 0.15
# realistic: Coulomb friction on asphalt (off-track surfaces get 5/7 of it)
friction = 0.7
# realistic: where a barrier hit lands on the car's side, as a fraction of its height above the floor (barriers and kerbs strike the lower body: the car tips toward them)
hit_height = 0.2
# realistic: velocity change in ONE physics step (m/s) that hands the car to the simulation
takeover_dv = 5.0
# arcade: lateral velocity change of the car in ONE physics step (m/s) above which a hit tips the car
threshold = 6.0
# roll rate (rad/s) per m/s of lateral velocity change above the threshold
gain = 0.9
# largest roll rate (rad/s) the mod ever asks for
cap = 8.0
# body collision: a box around the car stops the roof and sides sinking into the road while the car tumbles (untouched while upright)
body_box = true
# height of the box's roof above the car's origin (m); the game has no body height, 0.8 puts the roof about 1.2 m over the road, a heuristic
box_height = 0.8
# largest speed (m/s) away from the ground the car keeps in a step where its body touches it: limits the hop of a spinning car
box_kick_cap = 0.5
