id = "rollover"
name = "Rollovers"
version = "0.3.0"
library = "librollover.so"
api = 1
enabled = false

[settings]
# realistic: only big impacts roll the car; arcade: the threshold is halved and the gain raised, so smaller hits roll it
style = "realistic"
# lateral velocity change of the car in ONE physics step (m/s) above which a hit tips the car
threshold = 3.0
# roll rate (rad/s) per m/s of lateral velocity change above the threshold
gain = 2.5
# largest roll rate (rad/s) the mod ever asks for
cap = 12.0
# body collision: a box around the car stops the roof and sides sinking into the road while the car tumbles (untouched while upright)
body_box = true
# height of the box's roof above the car's origin (m); the game has no body height, 0.8 puts the roof about 1.2 m over the road, a heuristic
box_height = 0.8
# largest speed (m/s) away from the ground the car keeps in a step where its body touches it: limits the hop of a spinning car
box_kick_cap = 0.5
