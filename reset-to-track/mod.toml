id = "reset-to-track"
name = "Reset to track"
version = "0.2.0"
library = "libreset_to_track.so"
api = 1
enabled = false

[settings]
hold_ms = 500
cooldown_ms = 1000
rewind_ms = 2500
reset_keys = "R"
# a ring pose must have this many metres of straight asphalt ahead (along its heading, 1.5 m to each side too) to be restored: a pose that
# points off the road would put the car out of bounds again
ahead_m = 40
