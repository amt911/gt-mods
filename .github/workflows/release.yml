name: release

# A tag `vYYYY.MM.DD[.N]` builds every mod and publishes the archives + index.json as a GitHub Release.
# workflow_dispatch is a dry run: it builds and packs but uploads nothing (the files stay as a workflow artifact).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "gran-turismo-decomp commit SHA whose include/ the mods build against"
        required: false
        default: 509effb0b6b78c749247f2fe21ab94f8c80ab7ae

permissions:
  contents: read

env:
  # Pinned: the mods build against this commit of the public decomp repo's include/gt_mod/ headers.
  SDK_REF: ${{ inputs.sdk_ref || '509effb0b6b78c749247f2fe21ab94f8c80ab7ae' }}
  PLATFORM: linux-x86_64

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only used by the tag-only upload step
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: gt-mods
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: amt911/gran-turismo-decomp
          ref: ${{ env.SDK_REF }}
          path: gran-turismo-decomp
          sparse-checkout: include
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tool tests
        working-directory: gt-mods
        run: |
          python -m pip install pytest pytest-cov
          python -m pytest tests -q --cov=tools --cov-fail-under=80
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev
      - name: Build every mod (Release)
        working-directory: gt-mods
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ \
                -DGT_SDK_DIR="$GITHUB_WORKSPACE/gran-turismo-decomp/include"
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure
      - name: Pack archives and write index.json
        working-directory: gt-mods
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}
        run: |
          python tools/make_index.py --build-dir build --platform "$PLATFORM" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" --out-dir dist
          ls -l dist
      - name: Keep the files as a workflow artifact (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run
          path: gt-mods/dist/*
      - name: Upload to the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: gt-mods/dist/*
          fail_on_unmatched_files: true
